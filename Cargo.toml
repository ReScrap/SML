[package]
name    = "sml_loader"
version = "0.1.0"
edition = "2024"
 
[lib]
name       = "sml_loader"
crate-type = ["cdylib"]
 
[dependencies]
aes = "0.8.4"
anyhow = { version = "1.0.102", features = ["backtrace"] }
binrw = "0.15.1"
byteorder = "1.5.0"
cbc = "0.1.2"
linkme = "0.3.35"
pelite = { version = "0.10.0", features = ["unstable"] }
region = "3.0.2"
retour = { version = "0.4.0-alpha.4", features = ["static-detour" ,"thiscall-abi", "nightly"] }
rhexdump = "0.2.0"
sml_hook_macros = { path = "sml_hook_macros" }
win-msgbox = "0.2.2"
windows = { version = "0.62.2", features = [
    "Foundation_Diagnostics",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
